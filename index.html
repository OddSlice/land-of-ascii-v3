<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Land of Ascii v3</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #0d0e12; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; }
  #pic { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #view { display: block; image-rendering: pixelated; cursor: crosshair; }
  #hud { position: fixed; left: 10px; top: 8px; font: 11px/1.5 Menlo, Consolas, monospace; color: #dcd7cb;
    white-space: pre; pointer-events: none; text-shadow: 0 1px 0 #000, 0 0 4px #000; }
  #ref { position: relative; height: 100%; background: #111215; flex: none; }
  #ref img { display: block; height: 100%; image-rendering: auto; }
  #ref .label { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 8px; font: 11px Menlo, monospace;
    color: #dcd7cb; background: rgba(0, 0, 0, .55); }
  #ref .note { display: none; padding: 24px 18px; width: 260px; font: 12px/1.5 Menlo, monospace; color: #b9b4a8; }
  #ref.missing img, #ref.missing .label { display: none; }
  #ref.missing .note { display: block; }
  #look { position: fixed; right: 10px; top: 8px; padding: 6px 9px; font: 11px/1.6 Menlo, Consolas, monospace; color: #dcd7cb;
    white-space: pre; pointer-events: none; background: rgba(10, 11, 14, .62); }
  #progress { position: fixed; left: 0; right: 0; top: 45%; display: none; text-align: center;
    font: 12px/1.5 Menlo, Consolas, monospace; color: #dcd7cb; white-space: pre; }
  #error { position: fixed; inset: 0; display: none; z-index: 10; padding: 28px; background: #3a1010; color: #ffd9cf;
    font: 13px/1.5 Menlo, monospace; white-space: pre-wrap; }

  /* phase 2b: the hint, the start card and the menu, in the game's own
     monospace and the art bible's colours (src/app/menu.js); laid out again
     after phase 2b: a rail of tabs with icons, one section at a time */
  :root { --ink: #dcd7cb; --quiet: #a9a397; --head: #f0e6cc; --accent: #ffb060; --accent-hi: #ffc58a; --on-accent: #1d1409;
    --line: #383842; --line-soft: #25262d; --panel: rgba(13, 14, 18, .95); --rail: rgba(19, 20, 25, .97); --well: #0a0b0e;
    --hover: #1d1e24; --press: #2a2620; --press-line: rgba(255, 176, 96, .55); --cap: #18191e; --cap-line: #4a4a55;
    --mono: Menlo, Consolas, monospace; --ease: cubic-bezier(.2, .7, .2, 1); }
  #hud { padding: 4px 8px; margin: -4px -8px; border-radius: 4px; background: rgba(10, 11, 14, .42); font-variant-numeric: tabular-nums; }
  #hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 6px 12px; font: 12px/1.4 var(--mono);
    color: var(--ink); background: rgba(13, 14, 18, .72); border: 1px solid var(--line); border-radius: 5px; pointer-events: none;
    opacity: 0; transition: opacity 300ms ease; }
  #hint.on { opacity: 1; }
  #hint kbd, #card kbd, .menu kbd { display: inline-block; min-width: 1.9em; padding: 0 5px; margin-right: 3px; font: 600 11px/1.6 var(--mono);
    color: var(--head); text-align: center; background: var(--cap); border: 1px solid var(--cap-line); border-bottom-width: 2px; border-radius: 4px; }
  #hint kbd { margin-right: 8px; }
  #card { position: fixed; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center; cursor: pointer;
    background: rgba(13, 14, 18, .35); opacity: 0; transition: opacity 200ms ease; }
  #card.on { display: flex; }
  #card.shown { opacity: 1; }
  #card .box { max-width: calc(100vw - 32px); padding: 24px 30px 26px; font: 13px/1.6 var(--mono); color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  #card h1 { margin: 0 0 4px; font: 600 18px/1.3 var(--mono); color: var(--head); letter-spacing: .02em; }
  #card .go { margin: 0 0 16px; color: var(--accent); }
  #card dl { display: grid; grid-template-columns: max-content 1fr; gap: 7px 16px; margin: 0; align-items: center; }
  #card dt { display: flex; white-space: nowrap; } #card dd { margin: 0; color: var(--quiet); }

  .menu { position: fixed; inset: 0; z-index: 8; display: none; align-items: center; justify-content: center; font: 13px/1.55 var(--mono); color: var(--ink); }
  .menu.on { display: flex; }
  .menu ::selection { background: rgba(255, 176, 96, .32); color: var(--head); }
  .menu .back { position: absolute; inset: 0; background: rgba(8, 9, 12, .55); opacity: 0; transition: opacity 200ms ease; }
  .menu .panel { position: relative; display: grid; grid-template-columns: 216px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; width: min(920px, calc(100vw - 32px));
    height: min(620px, calc(100vh - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
    opacity: 0; transform: translateY(8px); transition: opacity 200ms var(--ease), transform 260ms var(--ease); }
  .menu.shown .back, .menu.shown .panel { opacity: 1; transform: none; }

  /* the rail: the title, where and when, the tabs, Resume */
  .menu .rail { grid-area: 1 / 1; display: flex; flex-direction: column; gap: 20px; min-height: 0; padding: 20px 12px 12px; background: var(--rail); border-right: 1px solid var(--line); }
  .menu .foot { grid-area: 2 / 1; display: flex; padding: 0 12px 12px; background: var(--rail); border-right: 1px solid var(--line); }
  .menu .brand { padding: 0 10px; }
  .menu h1 { margin: 0 0 8px; font: 600 15px/1.3 var(--mono); color: var(--head); letter-spacing: .01em; }
  .menu .status { display: flex; flex-direction: column; margin: 0; font-size: 11.5px; line-height: 1.55; color: var(--quiet); font-variant-numeric: tabular-nums; }
  .menu .tabs { display: flex; flex-direction: column; gap: 2px; }
  .menu .tabs [role="tab"] { justify-content: flex-start; gap: 11px; width: 100%; padding: 8px 10px; color: var(--quiet); border-color: transparent; text-align: left; }
  .menu .tabs [role="tab"]:hover { color: var(--ink); background: var(--hover); border-color: transparent; }
  .menu .tabs [role="tab"][aria-selected="true"] { color: var(--head); background: var(--press); border-color: #4b4235; }
  .menu .tabs [role="tab"][aria-selected="true"] .ic { color: var(--accent); }
  .menu .resume { flex: 1; justify-content: flex-start; gap: 10px; padding: 9px 10px 9px 12px; font-weight: 600;
    color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
  .menu .resume:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
  .menu .resume kbd { margin: 0 0 0 auto; color: var(--on-accent); background: rgba(29, 20, 9, .1); border-color: rgba(29, 20, 9, .38); }

  /* the section shown */
  .menu .pane { grid-area: 1 / 2 / 3 / 3; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 22px 28px 28px; scrollbar-width: thin; scrollbar-color: #4a4740 transparent; }
  .menu .pane::-webkit-scrollbar { width: 8px; } .menu .pane::-webkit-scrollbar-thumb { background: #4a4740; border-radius: 4px; }
  .menu [role="tabpanel"]:not([hidden]) { animation: menu-in 200ms var(--ease); }
  @keyframes menu-in { from { opacity: 0; transform: translateY(4px); } }
  .menu [role="tabpanel"] > header { margin-bottom: 18px; }
  .menu h2 { margin: 0; font: 600 17px/1.3 var(--mono); color: var(--head); }
  .menu .lead { margin: 4px 0 0; color: var(--quiet); }
  .menu h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font: 600 12px/1.4 var(--mono); color: var(--head); letter-spacing: .03em; }
  .menu h3 .ic { color: var(--accent); }
  .menu h3.part { margin: 26px 0 2px; font-weight: 400; color: var(--quiet); }

  /* the keys, in two balanced columns */
  .menu .keygroups { columns: 2 260px; column-gap: 36px; }
  .menu .keygroup { break-inside: avoid; margin-bottom: 22px; }
  .menu .keys { margin: 0; }
  .menu .keys > div { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 5px 0; border-top: 1px solid var(--line-soft); }
  .menu .keys > div:first-child { border-top: 0; }
  .menu .keys dt { order: 2; display: flex; flex: none; white-space: nowrap; } .menu .keys dt kbd:last-child { margin-right: 0; }
  .menu .keys dd { order: 1; margin: 0; color: var(--ink); }

  /* a setting: its name and words on the left, its control on the right or below */
  .menu .setting { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px 24px; padding: 14px 0; border-top: 1px solid var(--line-soft); }
  .menu header + .setting, .menu h3.part + .setting, .menu .now + .setting { border-top: 0; }
  .menu .setting.wide { grid-template-columns: minmax(0, 1fr); }
  .menu .setting .label { display: block; color: var(--head); }
  .menu .setting .words { margin: 2px 0 0; font-size: 12px; color: var(--quiet); }
  .menu .setting .words:empty { display: none; }
  .menu .now { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin: 0 0 4px; padding: 12px 14px;
    color: var(--quiet); background: var(--well); border: 1px solid var(--line-soft); border-radius: 6px; }
  .menu .now .clock { font: 600 22px/1.1 var(--mono); color: var(--head); font-variant-numeric: tabular-nums; }

  /* controls */
  .menu button, .menu input, .menu output { font: inherit; color: var(--ink); }
  .menu button { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; background: transparent; border: 1px solid var(--line);
    border-radius: 4px; cursor: pointer; transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease; }
  .menu button:hover { background: var(--hover); border-color: #5a5650; }
  .menu button:active { transform: translateY(1px); }
  .menu button:focus-visible, .menu input:focus-visible, #card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .menu .ic { flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .menu .seg { display: flex; flex-wrap: wrap; gap: 3px; width: fit-content; max-width: 100%; padding: 3px; background: var(--well); border: 1px solid var(--line); border-radius: 6px; }
  .menu .seg button { color: var(--quiet); border-color: transparent; padding: 4px 11px; }
  .menu .seg button:hover { color: var(--ink); background: var(--hover); border-color: transparent; }
  .menu .seg button[aria-pressed="true"], .menu .opts button[aria-pressed="true"] { color: var(--accent); background: var(--press); border-color: var(--press-line); }
  .menu .opts { display: flex; flex-wrap: wrap; gap: 4px; }
  .menu .switch { gap: 10px; padding: 4px 5px 4px 10px; }
  .menu .switch .state { min-width: 3ch; text-align: right; color: var(--quiet); }
  .menu .switch .track { position: relative; width: 34px; height: 18px; background: #26272d; border: 1px solid var(--cap-line); border-radius: 9px;
    transition: background-color 150ms ease, border-color 150ms ease; }
  .menu .switch .knob { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: var(--quiet); border-radius: 50%;
    transition: transform 180ms var(--ease), background-color 150ms ease; }
  .menu .switch[aria-checked="true"] .state { color: var(--accent); }
  .menu .switch[aria-checked="true"] .track { background: var(--press); border-color: var(--accent); }
  .menu .switch[aria-checked="true"] .knob { transform: translateX(16px); background: var(--accent); }
  .menu input[type="text"] { width: 12ch; padding: 4px 8px; background: var(--well); border: 1px solid var(--line); border-radius: 4px; caret-color: var(--accent); }
  .menu input[type="text"]::placeholder { color: #8d887e; }
  .menu input[type="range"] { width: min(240px, 50vw); margin: 0; accent-color: var(--accent); cursor: pointer; vertical-align: middle; }
  .menu .value { min-width: 6ch; color: var(--head); font-variant-numeric: tabular-nums; }
  .menu .inline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .menu .seed { color: var(--head); }
  .menu .note { color: var(--quiet); }
  .menu .line { margin: 0; }
  /* (phase 3b) short windows (a 1280 x 720 screen, less the browser's bars):
     the keys closer together, so the Controls fit with no scrolling */
  @media (max-height: 760px) {
    .menu [role="tabpanel"] > header { margin-bottom: 12px; }
    .menu .pane { padding-top: 16px; padding-bottom: 16px; }
    .menu .keygroup { margin-bottom: 12px; }
    .menu .keys > div { padding: 3px 0; }
    .menu h3 { margin-bottom: 6px; }
  }
  /* (phase 3b) the benchmark's table */
  .menu .bench { width: 100%; margin: 4px 0 12px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .menu .bench caption { caption-side: top; padding: 0 0 6px; text-align: left; font-size: 12px; color: var(--quiet); }
  .menu .bench th, .menu .bench td { padding: 4px 8px 4px 0; border-top: 1px solid var(--line-soft); text-align: right; font-weight: 400; }
  .menu .bench th[scope="row"], .menu .bench thead th:first-child { text-align: left; color: var(--ink); }
  .menu .bench thead th { color: var(--quiet); border-top: 0; }
  .menu .bench td { color: var(--head); }
  .menu button:disabled { opacity: .45; cursor: default; }
  .menu button:disabled:active { transform: none; }

  /* narrow windows: the rail becomes a bar across the top */
  @media (max-width: 720px) {
    .menu .panel { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr); width: calc(100vw - 24px); height: calc(100vh - 24px); }
    .menu .rail { grid-area: 1 / 1 / 2 / 3; flex-flow: row wrap; align-items: center; gap: 10px; padding: 12px; border-right: 0; border-bottom: 1px solid var(--line); }
    .menu .foot { grid-area: 1 / 2; align-self: start; padding: 12px 12px 0 0; background: none; border: 0; }
    .menu .brand { flex: 1; padding: 0 4px; min-height: 38px; display: flex; align-items: center; } .menu h1 { margin: 0; } .menu .status { display: none; }
    .menu .resume kbd { display: none; }
    .menu .pane { grid-area: 2 / 1 / 3 / 3; }
    .menu .tabs { order: 3; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; }
    .menu .tabs [role="tab"] { flex-direction: column; justify-content: center; gap: 4px; padding: 7px 4px; font-size: 11px; text-align: center; }
    .menu .setting:has(input[type="range"]) { grid-template-columns: minmax(0, 1fr); }
    .menu .pane { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .menu .panel { transform: none; } .menu [role="tabpanel"]:not([hidden]) { animation: none; } .menu .switch .knob { transition: none; }
  }
</style>

<body>
<div id="stage">
  <div id="pic"><canvas id="view"></canvas></div>
  <div id="ref" style="display:none">
    <img alt="reference frame">
    <div class="label"></div>
    <div class="note">The reference frames are other people's footage, kept private in a local copy (reference/thumbs/, made by tools/refs.mjs). They are not part of the published page.</div>
  </div>
</div>
<div id="hud"></div>
<div id="progress"></div>
<div id="look" style="display:none"></div>
<div id="hint" aria-hidden="true"><kbd>Esc</kbd>menu and controls</div>
<div id="card" role="dialog" aria-labelledby="card-title" tabindex="-1">
  <div class="box">
    <h1 id="card-title">Land of Ascii</h1>
    <p class="go">click to explore</p>
    <dl>
      <dt><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></dt><dd>walk (Shift runs)</dd>
      <dt><kbd>mouse</kbd></dt><dd>look</dd>
      <dt><kbd>F</kbd></dt><dd>fly</dd>
      <dt><kbd>Esc</kbd></dt><dd>menu: every control and option</dd>
    </dl>
  </div>
</div>
<div id="menu" class="menu" aria-hidden="true"></div>
<div id="error"></div>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Land of Ascii</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #0d0e12; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; }
  #pic { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #view { display: block; image-rendering: pixelated; cursor: crosshair; }
  #hud { position: fixed; left: 10px; top: 8px; font: 11px/1.5 Menlo, Consolas, monospace; color: #dcd7cb;
    white-space: pre; pointer-events: none; text-shadow: 0 1px 0 #000, 0 0 4px #000; }
  #progress { position: fixed; left: 0; right: 0; top: 45%; display: none; text-align: center;
    font: 12px/1.5 Menlo, Consolas, monospace; color: #dcd7cb; white-space: pre; }
  #error { position: fixed; inset: 0; display: none; z-index: 10; padding: 28px; background: #3a1010; color: #ffd9cf;
    font: 13px/1.5 Menlo, monospace; white-space: pre-wrap; }

  /* phase 2b: the hint, the start card and the menu, in the game's own
     monospace and the art bible's colours (src/app/menu.js); laid out again
     after phase 2b: a rail of tabs with icons, one section at a time */
  :root { --ink: #dcd7cb; --quiet: #a9a397; --head: #f0e6cc; --accent: #ffb060; --accent-hi: #ffc58a; --on-accent: #1d1409;
    --line: #383842; --line-soft: #25262d; --panel: rgba(13, 14, 18, .95); --rail: rgba(19, 20, 25, .97); --well: #0a0b0e;
    --hover: #1d1e24; --press: #2a2620; --press-line: rgba(255, 176, 96, .55); --cap: #18191e; --cap-line: #4a4a55;
    --mono: Menlo, Consolas, monospace; --ease: cubic-bezier(.2, .7, .2, 1); }
  #hud { padding: 4px 8px; margin: -4px -8px; border-radius: 4px; background: rgba(10, 11, 14, .42); font-variant-numeric: tabular-nums; }
  #hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 6px 12px; font: 12px/1.4 var(--mono);
    color: var(--ink); background: rgba(13, 14, 18, .72); border: 1px solid var(--line); border-radius: 5px; pointer-events: none;
    opacity: 0; transition: opacity 300ms ease; }
  #hint.on { opacity: 1; }
  /* (phase 4a) what someone says when greeted: their name and role, then
     the line, low on the screen, in the menu's quiet style */
  #say { position: fixed; left: 50%; bottom: 54px; transform: translateX(-50%); max-width: min(620px, calc(100vw - 32px)); padding: 9px 16px 10px;
    font: 13px/1.5 var(--mono); color: var(--ink); background: rgba(13, 14, 18, .78); border: 1px solid var(--line); border-radius: 6px;
    pointer-events: none; opacity: 0; transition: opacity 260ms ease; text-align: center; }
  #say.on { opacity: 1; }


  /* (phase 6) your keys, in Controls; the share line's box */
  .menu .keysown { margin-bottom: 12px; }
  .menu .binds { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0 18px; margin: 4px 0 8px; }
  .menu .bind { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 1px 0; border-bottom: 1px solid var(--line-soft); }
  .menu .bind .what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu .bind .what { color: var(--quiet); }
  .menu .rebind { display: inline-flex; align-items: center; gap: 8px; padding: 2px 6px; background: none; border: 1px solid transparent; border-radius: 4px; cursor: pointer; color: var(--quiet); font: 11px var(--mono); }
  .menu .rebind:hover { background: var(--hover); border-color: var(--line); }
  .menu .rebind kbd { margin: 0; min-width: 2.2em; }
  .menu .rebind .change { opacity: 0; }
  .menu .rebind:hover .change, .menu .rebind:focus-visible .change { opacity: 1; }
  .menu .rebind.listening kbd { color: var(--on-accent); background: var(--accent); border-color: #000; }
  .menu .keysaid { margin: 0 0 0 10px; }
  .menu .check { display: inline-flex; align-items: center; gap: 6px; color: var(--quiet); cursor: pointer; }
  .menu .check input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  /* (phase 6) the title screen (src/app/title.js): the world drifting behind,
     a panel framed in glyph stone and timber, the name in glyph lettering */
  #title { position: fixed; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center; font: 13px/1.5 var(--mono); color: var(--ink); }
  #title[hidden] { display: none; }
  #title::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(13, 14, 18, .15) 30%, rgba(13, 14, 18, .62) 100%); pointer-events: none; transition: background 600ms ease; }
  #title.measuring::before { background: rgba(13, 14, 18, .9); }
  #title .xfade { position: fixed; pointer-events: none; opacity: 0; image-rendering: pixelated; }
  #title .panel { position: relative; opacity: 0; transform: translateY(8px); transition: opacity 900ms ease, transform 900ms var(--ease); max-width: calc(100vw - 24px); }
  #title.shown .panel { opacity: 1; transform: none; transition-duration: 220ms; }
  #title .frame { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; }
  #title .inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 46px 40px 40px; width: min(600px, calc(100vw - 72px)); box-sizing: border-box; zoom: var(--ui-text, 1); }
  #title .name { display: block; max-width: 100%; }
  #title .welcome { margin: 2px 0 8px; text-align: center; color: var(--quiet); font-style: italic; }
  #title .choices { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 360px; }
  #title .choice { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%; padding: 8px 14px 9px; font: 600 14px/1.3 var(--mono); color: var(--head); text-align: left;
    background: rgba(29, 30, 36, .85); border: 1px solid var(--line); border-radius: 5px; cursor: pointer; }
  #title .choice .more { font: 400 11.5px/1.35 var(--mono); color: var(--quiet); }
  #title .choice:hover { background: var(--hover); border-color: #55555f; }
  #title .choice.main { color: var(--on-accent); background: var(--accent); border-color: #000; }
  #title .choice.main .more { color: rgba(29, 20, 9, .78); }
  #title .choice.main:hover { background: var(--accent-hi); }
  #title button:focus-visible, #title input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #title .choice.main:focus-visible { outline-color: var(--head); }
  #title .newrow { display: flex; gap: 6px; padding: 2px 0 4px; }
  #title .newrow[hidden] { display: none; }
  #title .newrow input { flex: 1; min-width: 0; padding: 6px 9px; font: 13px var(--mono); color: var(--ink); background: var(--well); border: 1px solid var(--line); border-radius: 4px; }
  #title .small { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; font: 12px var(--mono); color: var(--ink); background: var(--cap); border: 1px solid var(--cap-line); border-radius: 4px; cursor: pointer; }
  #title .small:hover { background: var(--hover); }
  #title .small svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  #title .note { min-height: 1.4em; margin: 2px 0 0; max-width: 360px; text-align: center; font-size: 12px; color: var(--accent-hi); }
  #title .foot { position: absolute; left: 0; right: 0; bottom: 10px; margin: 0; text-align: center; font-size: 11px; color: var(--quiet); text-shadow: 0 1px 2px #000; }
  /* (phase 6.1) a short window: the panel a little tighter, and kept clear of the foot */
  @media (max-height: 700px) {
    #title { padding-bottom: 26px; box-sizing: border-box; }
    #title .inner { padding-top: 26px; padding-bottom: 22px; gap: 6px; }
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* (phase 6) paused while the window is elsewhere */
  #away { position: fixed; inset: 0; z-index: 7; display: none; align-items: center; justify-content: center; background: rgba(13, 14, 18, .55); cursor: pointer; }
  #away.on { display: flex; }
  #away .box { display: flex; flex-direction: column; gap: 4px; padding: 14px 20px; font: 13px/1.5 var(--mono); color: var(--ink); text-align: center;
    background: rgba(13, 14, 18, .9); border: 1px solid var(--line); border-radius: 6px; zoom: var(--ui-text, 1); }
  #away b { color: var(--head); } #away span { color: var(--quiet); font-size: 12px; }
  /* (phase 6) a browser that cannot run the game */
  #error.unsupported { background: #0d0e12; color: var(--ink); white-space: normal; max-width: 640px; margin: 0 auto; font: 14px/1.6 var(--mono); padding: 48px 24px; }
  #error.unsupported h1 { font: 600 18px/1.4 var(--mono); color: var(--head); margin: 0 0 12px; }
  #error.unsupported li { color: var(--accent-hi); }
  /* (phase 6) the text size: the menu's and the journal's pages, what is said, the prompts */
  .menu [role="tabpanel"], .menu .viewer .bar, #say, #prompt, #sign, #talk, #note, #hint { zoom: var(--ui-text, 1); }
  /* (phase 6) reduced motion: nothing slides, pulses or drifts */
  html.still *, html.still *::before, html.still *::after { transition-duration: 0ms !important; animation: none !important; }

  /* (0.5.5) the map's drawn layer (src/app/mapover.js): the compass, the
     places and their names, a legend, a scale and you, over the glyph map */
  #mapover { position: fixed; inset: 0; z-index: 2; pointer-events: none; font: 11px/1.3 var(--mono); color: var(--ink); }
  #mapover[hidden] { display: none; }
  #mapover > * { position: absolute; }
  #mapover svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
  #mapover .frame { box-sizing: border-box; border: 1px solid rgba(240, 230, 204, .55); outline: 1px solid rgba(0, 0, 0, .6);
    box-shadow: inset 0 0 0 3px rgba(13, 14, 18, .35); }
  #mapover .ns, #mapover .ew { transform: translate(-50%, -50%); font: 700 13px/1 var(--mono); color: var(--head); letter-spacing: .04em;
    padding: 3px 6px; background: rgba(13, 14, 18, .82); border: 1px solid var(--line); border-radius: 4px; }
  #mapover .ns.n { transform: translate(-50%, 0); color: var(--accent); }
  #mapover .ns.s { transform: translate(-50%, -100%); }
  #mapover .rose { width: 56px; height: 64px; color: var(--quiet); }
  #mapover .rose svg { stroke-width: 1.4; }
  #mapover .rose .north { fill: var(--accent); stroke: var(--accent); }
  #mapover .rose .south { fill: rgba(240, 230, 204, .25); }
  #mapover .rose text { fill: var(--accent); stroke: none; font: 700 9px var(--mono); text-anchor: middle; }
  #mapover .labels { inset: 0; }
  #mapover .labels > span { position: absolute; white-space: nowrap; }
  #mapover .mark { width: 18px; height: 18px; transform: translate(-50%, -50%); padding: 2px; border-radius: 50%; color: var(--head);
    background: rgba(13, 14, 18, .86); border: 1px solid rgba(240, 230, 204, .5); }
  #mapover .mark svg { stroke-width: 2; }
  #mapover .mark.village, #mapover .mark.fort { width: 22px; height: 22px; color: var(--on-accent); background: var(--head); border-color: #000; }
  #mapover .mark.fort { background: var(--accent); }
  #mapover .mark.bridge, #mapover .mark.source, #mapover .mark.foot, #mapover .mark.coast { width: 14px; height: 14px; color: var(--ink); }
  #mapover .name { padding: 1px 5px 2px; color: var(--ink); background: rgba(13, 14, 18, .74); border-radius: 3px; text-shadow: 0 1px 0 #000; }
  #mapover .name.big { font: 700 12px/1.35 var(--mono); color: var(--head); letter-spacing: .03em; background: rgba(13, 14, 18, .86); }
  #mapover .name.viewpoint, #mapover .name.source, #mapover .name.foot, #mapover .name.coast { font-style: italic; color: var(--quiet); }
  #mapover .water { font: italic 11px var(--mono); color: #b9cdf0; letter-spacing: .08em; text-shadow: 0 1px 2px #0b1730, 0 0 3px #0b1730; }
  #mapover .you { left: 0; top: 0; width: 160px; height: 160px; margin: -80px 0 0 -80px; }
  #mapover .you svg { transform-origin: 50% 50%; }
  #mapover .you .cone { fill: rgba(255, 176, 96, .16); stroke: rgba(255, 176, 96, .5); stroke-width: 1; }
  #mapover .you .ring { fill: rgba(13, 14, 18, .65); stroke: var(--accent); stroke-width: 2; animation: mapPulse 1.8s ease-in-out infinite; }
  #mapover .you .arrow { fill: var(--accent); stroke: #000; stroke-width: 1.2; }
  @keyframes mapPulse { 50% { stroke-opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { #mapover .you .ring { animation: none; } }
  #mapover .legend { box-sizing: border-box; padding: 12px 14px 12px; background: rgba(13, 14, 18, .9); border: 1px solid var(--line); border-radius: 6px; }
  #mapover .legend.over { padding: 8px 10px; background: rgba(13, 14, 18, .82); }
  #mapover .legend h2 { margin: 0 0 2px; font: 700 13px var(--mono); color: var(--head); letter-spacing: .06em; text-transform: uppercase; }
  #mapover .legend .found { margin: 0 0 10px; color: var(--quiet); }
  #mapover .legend ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
  #mapover .legend ul + ul { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line-soft); }
  #mapover .legend li { display: flex; align-items: center; gap: 8px; }
  #mapover .legend li[hidden] { display: none; }
  #mapover .legend.over ul.land { grid-template-columns: 1fr 1fr; column-gap: 12px; }
  #mapover .legend.over h2, #mapover .legend.over .found { display: none; }
  #mapover .mk { flex: none; width: 16px; height: 16px; color: var(--head); }
  #mapover .mk.fort { color: var(--accent); }
  #mapover .mk.youmk svg { fill: var(--accent); stroke: #000; stroke-width: 1.2; }
  #mapover .sw { flex: none; width: 16px; height: 10px; border-radius: 2px; border: 1px solid rgba(0, 0, 0, .5); }
  #mapover .sw.road { background: #8a7457; } #mapover .sw.water { background: #4d6a9c; } #mapover .sw.forest { background: #2c4529; }
  #mapover .sw.meadow { background: #6c8a3c; } #mapover .sw.rock { background: #8c877c; } #mapover .sw.snow { background: #e4e4e0; }
  #mapover .sw.unknown { background: #17181d; border-color: #2c2d35; }
  #mapover .scale { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 4px 8px 4px; background: rgba(13, 14, 18, .78); border-radius: 4px; }
  #mapover .scale .bar { display: block; height: 5px; border: 1.5px solid var(--head); border-top: none; }
  #mapover .scale .len { color: var(--head); }
  #mapover .readout { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: center; color: var(--quiet); }
  #mapover .readout.side { flex-direction: column; align-items: flex-start; gap: 6px; }
  #mapover .readout .facing { color: var(--head); }
  #mapover .readout span { padding: 2px 8px; background: rgba(13, 14, 18, .78); border-radius: 4px; }
  #mapover kbd { display: inline-block; min-width: 1.9em; padding: 0 5px; margin-right: 6px; font: 600 11px/1.6 var(--mono); color: var(--head); text-align: center;
    background: var(--cap); border: 1px solid var(--cap-line); border-bottom-width: 2px; border-radius: 4px; }
  /* (0.5.5) the prompt when someone is near enough to greet, and a signpost read as you pass */
  #prompt { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 5px 12px 5px 8px; font: 12px/1.4 var(--mono);
    color: var(--ink); background: rgba(13, 14, 18, .74); border: 1px solid var(--line); border-radius: 5px; pointer-events: none;
    opacity: 0; transition: opacity 180ms ease; white-space: nowrap; }
  #prompt.on { opacity: 1; }
  #prompt kbd { display: inline-block; min-width: 1.9em; padding: 0 5px; margin-right: 8px; font: 600 11px/1.6 var(--mono); color: var(--head); text-align: center;
    background: var(--cap); border: 1px solid var(--cap-line); border-bottom-width: 2px; border-radius: 4px; }
  #prompt b { color: var(--head); font-weight: 600; }
  #sign { position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%); min-width: 260px; max-width: calc(100vw - 32px); padding: 10px 14px 10px;
    font: 12px/1.45 var(--mono); color: var(--ink); background: rgba(24, 19, 13, .9); border: 1px solid #5b4a33; border-radius: 6px;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .5); pointer-events: none; opacity: 0; transition: opacity 220ms ease; }
  #sign.on { opacity: 1; }
  #sign .head { margin-bottom: 6px; font-size: 11px; color: #c9b48f; letter-spacing: .06em; text-transform: uppercase; }
  #sign ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  #sign li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; }
  #sign .dir { width: 20px; height: 20px; color: var(--accent); }
  #sign .dir svg { display: block; width: 100%; height: 100%; fill: currentColor; transition: transform 120ms linear; }
  #sign .to b { color: var(--head); font-weight: 600; }
  #sign .to i { color: var(--quiet); font-style: normal; }
  #sign .far { color: var(--quiet); text-align: right; }
  .menu .people { display: grid; gap: 2px; max-height: 280px; overflow: auto; margin-top: 6px; padding-right: 4px; }
  .menu .person { display: grid; grid-template-columns: 11em 10em 1fr; gap: 8px; text-align: left; padding: 4px 8px; font: 12px/1.4 var(--mono); }
  .menu .person b { color: var(--head); font-weight: 600; }
  .menu .person .role, .menu .person .act { color: var(--quiet); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #say .who { font-size: 11px; color: var(--quiet); letter-spacing: .02em; margin-bottom: 3px; }
  #say .who b { color: var(--head); font-weight: 600; }
  #hint kbd, #card kbd, .menu kbd { display: inline-block; min-width: 1.9em; padding: 0 5px; margin-right: 3px; font: 600 11px/1.6 var(--mono);
    color: var(--head); text-align: center; background: var(--cap); border: 1px solid var(--cap-line); border-bottom-width: 2px; border-radius: 4px; }
  #hint kbd { margin-right: 4px; }
  #card { position: fixed; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center; cursor: pointer;
    background: rgba(13, 14, 18, .35); opacity: 0; transition: opacity 200ms ease; }
  #card.on { display: flex; }
  #card.shown { opacity: 1; }
  #card .box { max-width: calc(100vw - 32px); padding: 24px 30px 26px; font: 13px/1.6 var(--mono); color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  #card h1 { margin: 0 0 4px; font: 600 18px/1.3 var(--mono); color: var(--head); letter-spacing: .02em; }
  #card .go { margin: 0 0 16px; color: var(--accent); }
  #card dl { display: grid; grid-template-columns: max-content 1fr; gap: 7px 16px; margin: 0; align-items: center; }
  #card dt { display: flex; white-space: nowrap; } #card dd { margin: 0; color: var(--quiet); }

  .menu { position: fixed; inset: 0; z-index: 8; display: none; align-items: center; justify-content: center; font: 13px/1.55 var(--mono); color: var(--ink); }
  .menu.on { display: flex; }
  .menu ::selection { background: rgba(255, 176, 96, .32); color: var(--head); }
  .menu .back { position: absolute; inset: 0; background: rgba(8, 9, 12, .55); opacity: 0; transition: opacity 200ms ease; }
  .menu .panel { position: relative; display: grid; grid-template-columns: 216px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; width: min(920px, calc(100vw - 32px));
    height: min(680px, calc(100vh - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
    opacity: 0; transform: translateY(8px); transition: opacity 200ms var(--ease), transform 260ms var(--ease); }
  .menu.shown .back, .menu.shown .panel { opacity: 1; transform: none; }

  /* the rail: the title, where and when, the tabs, Resume */
  .menu .rail { grid-area: 1 / 1; display: flex; flex-direction: column; gap: 20px; min-height: 0; padding: 20px 12px 12px; background: var(--rail); border-right: 1px solid var(--line); }
  .menu .foot { grid-area: 2 / 1; display: flex; padding: 0 12px 12px; background: var(--rail); border-right: 1px solid var(--line); }
  .menu .version { margin: -4px 0 8px; font-size: 11px; line-height: 1.3; color: var(--quiet); font-variant-numeric: tabular-nums; user-select: text; }
  .menu .brand { padding: 0 10px; }
  .menu h1 { margin: 0 0 8px; font: 600 15px/1.3 var(--mono); color: var(--head); letter-spacing: .01em; }
  .menu .status { display: flex; flex-direction: column; margin: 0; font-size: 11.5px; line-height: 1.55; color: var(--quiet); font-variant-numeric: tabular-nums; }
  .menu .tabs { display: flex; flex-direction: column; gap: 2px; }
  .menu .tabs [role="tab"] { justify-content: flex-start; gap: 11px; width: 100%; padding: 8px 10px; color: var(--quiet); border-color: transparent; text-align: left; }
  .menu .tabs [role="tab"]:hover { color: var(--ink); background: var(--hover); border-color: transparent; }
  .menu .tabs [role="tab"][aria-selected="true"] { color: var(--head); background: var(--press); border-color: #4b4235; }
  .menu .tabs [role="tab"][aria-selected="true"] .ic { color: var(--accent); }
  .menu .resume { flex: 1; justify-content: flex-start; gap: 10px; padding: 9px 10px 9px 12px; font-weight: 600;
    color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
  .menu .resume:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
  .menu .resume kbd { margin: 0 0 0 auto; color: var(--on-accent); background: rgba(29, 20, 9, .1); border-color: rgba(29, 20, 9, .38); }

  /* the section shown */
  .menu .pane { grid-area: 1 / 2 / 3 / 3; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 22px 28px 28px; scrollbar-width: thin; scrollbar-color: #4a4740 transparent; }
  .menu .pane::-webkit-scrollbar { width: 8px; } .menu .pane::-webkit-scrollbar-thumb { background: #4a4740; border-radius: 4px; }
  .menu [role="tabpanel"]:not([hidden]) { animation: menu-in 200ms var(--ease); }
  @keyframes menu-in { from { opacity: 0; transform: translateY(4px); } }
  .menu [role="tabpanel"] > header { margin-bottom: 18px; }
  .menu h2 { margin: 0; font: 600 17px/1.3 var(--mono); color: var(--head); }
  .menu .lead { margin: 4px 0 0; color: var(--quiet); }
  .menu h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font: 600 12px/1.4 var(--mono); color: var(--head); letter-spacing: .03em; }
  .menu h3 .ic { color: var(--accent); }
  .menu h3.part { margin: 26px 0 2px; font-weight: 400; color: var(--quiet); }

  /* the keys, in two balanced columns */
  .menu .keygroups { columns: 2 260px; column-gap: 36px; }
  .menu .keygroup { break-inside: avoid; margin-bottom: 22px; }
  .menu .keys { margin: 0; }
  .menu .keys > div { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 5px 0; border-top: 1px solid var(--line-soft); }
  .menu .keys > div:first-child { border-top: 0; }
  .menu .keys dt { order: 2; display: flex; flex: none; white-space: nowrap; } .menu .keys dt kbd:last-child { margin-right: 0; }
  .menu .keys dd { order: 1; margin: 0; color: var(--ink); }

  /* a setting: its name and words on the left, its control on the right or below */
  .menu .setting { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px 24px; padding: 14px 0; border-top: 1px solid var(--line-soft); }
  .menu header + .setting, .menu h3.part + .setting, .menu .now + .setting { border-top: 0; }
  .menu .setting.wide { grid-template-columns: minmax(0, 1fr); }
  .menu .setting .label { display: block; color: var(--head); }
  .menu .setting .words { margin: 2px 0 0; font-size: 12px; color: var(--quiet); }
  .menu .setting .words:empty { display: none; }
  .menu .now { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin: 0 0 4px; padding: 12px 14px;
    color: var(--quiet); background: var(--well); border: 1px solid var(--line-soft); border-radius: 6px; }
  .menu .now .clock { font: 600 22px/1.1 var(--mono); color: var(--head); font-variant-numeric: tabular-nums; }

  /* controls */
  .menu button, .menu input, .menu output { font: inherit; color: var(--ink); }
  .menu button { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; background: transparent; border: 1px solid var(--line);
    border-radius: 4px; cursor: pointer; transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease; }
  .menu button:hover { background: var(--hover); border-color: #5a5650; }
  .menu button:active { transform: translateY(1px); }
  .menu button:focus-visible, .menu input:focus-visible, #card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .menu .ic { flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .menu .seg { display: flex; flex-wrap: wrap; gap: 3px; width: fit-content; max-width: 100%; padding: 3px; background: var(--well); border: 1px solid var(--line); border-radius: 6px; }
  .menu .seg button { color: var(--quiet); border-color: transparent; padding: 4px 11px; }
  .menu .seg button:hover { color: var(--ink); background: var(--hover); border-color: transparent; }
  .menu .seg button[aria-pressed="true"], .menu .opts button[aria-pressed="true"] { color: var(--accent); background: var(--press); border-color: var(--press-line); }
  .menu .opts { display: flex; flex-wrap: wrap; gap: 4px; }
  .menu .switch { gap: 10px; padding: 4px 5px 4px 10px; }
  .menu .switch .state { min-width: 3ch; text-align: right; color: var(--quiet); }
  .menu .switch .track { position: relative; width: 34px; height: 18px; background: #26272d; border: 1px solid var(--cap-line); border-radius: 9px;
    transition: background-color 150ms ease, border-color 150ms ease; }
  .menu .switch .knob { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: var(--quiet); border-radius: 50%;
    transition: transform 180ms var(--ease), background-color 150ms ease; }
  .menu .switch[aria-checked="true"] .state { color: var(--accent); }
  .menu .switch[aria-checked="true"] .track { background: var(--press); border-color: var(--accent); }
  .menu .switch[aria-checked="true"] .knob { transform: translateX(16px); background: var(--accent); }
  .menu input[type="text"] { width: 12ch; padding: 4px 8px; background: var(--well); border: 1px solid var(--line); border-radius: 4px; caret-color: var(--accent); }
  .menu input[type="text"]::placeholder, .menu textarea::placeholder { color: #8d887e; }
  /* (phase 5a) the progress: the save line, the backup box, clearing */
  .menu textarea { display: block; width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 6px 8px; font: 11px/1.4 var(--mono); color: var(--ink);
    background: var(--well); border: 1px solid var(--line); border-radius: 4px; resize: vertical; caret-color: var(--accent); }
  .menu textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .menu .saveline { color: var(--ink); }
  .menu [hidden] { display: none !important; }
  .menu .ask > span { color: var(--head); }
  .menu button.danger { color: #ffd2bf; border-color: #7a4a3a; } .menu button.danger:hover { background: #3a231c; border-color: #a5644d; }
  .menu input[type="range"] { width: min(240px, 50vw); margin: 0; accent-color: var(--accent); cursor: pointer; vertical-align: middle; }
  .menu .value { min-width: 6ch; color: var(--head); font-variant-numeric: tabular-nums; }
  .menu .inline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .menu .seed { color: var(--head); }
  .menu .note { color: var(--quiet); }
  .menu .line { margin: 0; }
  /* (phase 3b) short windows (a 1280 x 720 screen, less the browser's bars):
     the keys closer together, so the Controls fit with no scrolling */
  @media (max-height: 760px) {
    .menu [role="tabpanel"] > header { margin-bottom: 12px; }
    .menu .pane { padding-top: 16px; padding-bottom: 16px; }
    .menu .keygroup { margin-bottom: 12px; }
    .menu .keys > div { padding: 3px 0; }
    .menu h3 { margin-bottom: 6px; }
  }
  /* (phase 3b) the benchmark's table */
  .menu .bench { width: 100%; margin: 4px 0 12px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .menu .bench caption { caption-side: top; padding: 0 0 6px; text-align: left; font-size: 12px; color: var(--quiet); }
  .menu .bench th, .menu .bench td { padding: 4px 8px 4px 0; border-top: 1px solid var(--line-soft); text-align: right; font-weight: 400; }
  .menu .bench th[scope="row"], .menu .bench thead th:first-child { text-align: left; color: var(--ink); }
  .menu .bench thead th { color: var(--quiet); border-top: 0; }
  .menu .bench td { color: var(--head); }
  .menu button:disabled { opacity: .45; cursor: default; }
  .menu button:disabled:active { transform: none; }

  /* narrow windows: the rail becomes a bar across the top */
  @media (max-width: 720px) {
    .menu .panel { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr); width: calc(100vw - 24px); height: calc(100vh - 24px); }
    .menu .rail { grid-area: 1 / 1 / 2 / 3; flex-flow: row wrap; align-items: center; gap: 10px; padding: 12px; border-right: 0; border-bottom: 1px solid var(--line); }
    .menu .foot { grid-area: 1 / 2; align-self: start; padding: 12px 12px 0 0; background: none; border: 0; }
    .menu .brand { flex: 1; padding: 0 4px; min-height: 38px; display: flex; align-items: center; } .menu h1 { margin: 0; } .menu .status { display: none; }
    .menu .resume kbd { display: none; } .menu .version { display: none; }
    .menu .pane { grid-area: 2 / 1 / 3 / 3; }
    .menu .tabs { order: 3; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; }
    .menu .tabs [role="tab"] { flex-direction: column; justify-content: center; gap: 4px; padding: 7px 4px; font-size: 11px; text-align: center; }
    .menu .setting:has(input[type="range"]) { grid-template-columns: minmax(0, 1fr); }
    .menu .pane { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .menu .panel { transform: none; } .menu [role="tabpanel"]:not([hidden]) { animation: none; } .menu .switch .knob { transition: none; }
  }

  /* (phase 5a) a quiet note low on the screen: a place the journal notes,
     a key for something new */
  #note { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 6px 12px; font: 12px/1.4 var(--mono); color: var(--ink);
    background: rgba(13, 14, 18, .72); border: 1px solid var(--line); border-radius: 5px; pointer-events: none; opacity: 0; transition: opacity 300ms ease; white-space: nowrap; }
  #note.on { opacity: 1; }
  #note kbd { display: inline-block; min-width: 1.9em; padding: 0 5px; margin-right: 8px; font: 600 11px/1.6 var(--mono); color: var(--head); text-align: center;
    background: var(--cap); border: 1px solid var(--cap-line); border-bottom-width: 2px; border-radius: 4px; }
  /* an exchange: who, two or three lines, and the choice */
  /* (phase 5b) the world dims under an exchange, whose clock stands still */
  #veil { position: fixed; inset: 0; z-index: 3; pointer-events: none; background: rgba(8, 9, 12, .32); opacity: 0; transition: opacity 420ms ease; }
  #veil.on { opacity: 1; }
  #talk { position: fixed; left: 50%; bottom: 54px; z-index: 4; transform: translateX(-50%); width: min(620px, calc(100vw - 32px)); padding: 11px 18px 12px;
    font: 13px/1.55 var(--mono); color: var(--ink); background: rgba(13, 14, 18, .86); border: 1px solid var(--line); border-radius: 6px;
    opacity: 0; transition: opacity 260ms ease; }
  #talk.on { opacity: 1; }
  #talk .who { font-size: 11px; color: var(--quiet); letter-spacing: .02em; margin-bottom: 5px; }
  #talk .who b { color: var(--head); font-weight: 600; }
  #talk .lines p { margin: 0 0 4px; }
  #talk .choice { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 9px; }
  #talk button { display: inline-flex; align-items: center; gap: 8px; padding: 4px 11px 4px 5px; font: inherit; font-size: 12px; color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 4px; cursor: pointer; transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease; }
  #talk button:hover { background: var(--hover); border-color: #5a5650; }
  #talk button.yes { color: var(--head); border-color: var(--press-line); background: var(--press); }
  #talk button.yes:hover { border-color: var(--accent); }
  #talk button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #talk kbd { display: inline-block; min-width: 2.4em; padding: 0 4px; font: 600 10.5px/1.6 var(--mono); color: var(--head); text-align: center;
    background: var(--cap); border: 1px solid var(--cap-line); border-bottom-width: 2px; border-radius: 4px; }
  #card .sub { margin: -10px 0 16px; color: var(--quiet); font-size: 12px; }
  #card .snd { margin: -8px 0 16px; color: var(--quiet); font-size: 12px; }

  /* the journal (J): the menu's panel, rail and tabs; its own lists */
  .journal .carry { margin-top: auto; padding: 0 10px; }
  .journal .carry h3 { margin-bottom: 4px; font-weight: 400; color: var(--quiet); }
  .journal .carried { margin: 0; padding: 0; list-style: none; font-size: 12px; line-height: 1.5; color: var(--ink); max-height: 132px; overflow: auto; }
  .journal .carried li { padding: 1px 0; } .journal .carried li.none { color: var(--quiet); }
  .journal .rows { margin: 4px 0 0; padding: 0; list-style: none; }
  .journal .row { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: baseline; gap: 4px 12px; padding: 6px 0; border-top: 1px solid var(--line-soft); }
  .journal .row:first-child { border-top: 0; }
  .journal .row .ic { align-self: center; color: var(--quiet); }
  .journal .row.found .ic { color: var(--accent); }
  .journal .row b { display: block; font-weight: 600; color: var(--quiet); }
  .journal .row.found b { color: var(--head); }
  .journal .sub { display: block; font-size: 12px; color: var(--quiet); }
  .journal .when { font-size: 12px; color: var(--quiet); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .journal .group h3.part { margin-top: 18px; }
  .journal button.link { padding: 2px 8px; font-size: 12px; color: var(--accent); }
  .journal .sketches { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 10px; margin-top: 8px; }
  .journal .card { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 6px; text-align: left; }
  .journal .card .thumb { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; image-rendering: pixelated; background: var(--well); border-radius: 3px; }
  .journal .card .cap b { display: block; font-weight: 600; color: var(--head); font-size: 12px; }
  .journal .favs { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .journal .fav { padding: 10px 12px; background: var(--well); border: 1px solid var(--line-soft); border-radius: 6px; }
  .journal .fav .head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .journal .fav .head b { color: var(--head); font-weight: 600; }
  .journal .fav p { margin: 2px 0 0; }
  .journal .fav.done p { color: var(--quiet); }
  .journal .note { margin-top: 18px; }
  /* the full-screen sketch, and its page-through */
  .journal .viewer { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: 16px 24px; background: rgba(8, 9, 12, .96); }
  .journal .viewer[hidden] { display: none; }
  .journal .viewer .frame { display: flex; align-items: center; justify-content: center; min-height: 0; }
  .journal .viewer canvas { display: block; max-width: calc(100vw - 48px); max-height: calc(100vh - 110px); image-rendering: pixelated; border: 1px solid var(--line); }
  .journal .viewer .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 18px; width: min(100%, 1100px); }
  .journal .viewer .caption { margin: 0; color: var(--ink); }
  .journal.viewing .panel, .journal.viewing .back { visibility: hidden; }
</style>
</head>
<body>
<div id="stage">
  <div id="pic"><canvas id="view"></canvas></div>
</div>
<div id="hud"></div>
<div id="progress"></div>
<div id="hint" aria-hidden="true"><kbd>Esc</kbd>menu and controls</div>
<div id="say" role="status" aria-live="polite"><div class="who"></div><div class="line"></div></div>
<div id="mapover" hidden></div>
<div id="prompt" aria-hidden="true"><kbd>E</kbd><span class="what"></span></div>
<div id="sign" role="status" aria-live="polite"><div class="head"></div><ul></ul></div>
<div id="note" role="status" aria-live="polite"></div>
<div id="veil" aria-hidden="true"></div>
<div id="talk" role="dialog" aria-live="polite" aria-label="talking" hidden></div>
<div id="title" hidden></div>
<div id="away" role="dialog" aria-label="paused"><div class="box"><b>Paused</b> while the window is elsewhere.<span>Click, or press Enter, to go on.</span></div></div>
<div id="menu" class="menu" aria-hidden="true"></div>
<div id="journal" class="menu journal" aria-hidden="true"></div>
<div id="error"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
